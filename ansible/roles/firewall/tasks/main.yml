---
- name: Install UFW
  ansible.builtin.apt:
    name: ufw
    state: present
    update_cache: true

- name: Set UFW default incoming policy to deny
  community.general.ufw:
    direction: incoming
    default: deny
  notify: Reload UFW

- name: Set UFW default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    default: allow
  notify: Reload UFW

- name: Set UFW default routed policy to deny
  community.general.ufw:
    direction: routed
    default: deny
  notify: Reload UFW

- name: Rate limit SSH on port 22
  community.general.ufw:
    rule: limit
    port: '22'
    proto: tcp
    comment: 'SSH Rate Limited'
  notify: Reload UFW

- name: Enable UFW firewall with logging
  community.general.ufw:
    state: enabled
    logging: "on"
