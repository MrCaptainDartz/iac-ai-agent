---
# tasks file for podman_gvisor

- name: Install Podman and rootless container dependencies
  ansible.builtin.apt:
    name:
      - podman
      - podman-docker
      - podman-compose
      - docker-compose-v2
      - uidmap
      - slirp4netns
      - fuse-overlayfs
      - dbus-user-session
      - curl
      - ca-certificates
    state: present
    update_cache: true

- name: Silence Docker emulation banner
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    mode: '0644'
    owner: root
    group: root
    modification_time: preserve
    access_time: preserve

- name: Create docker-compose compatibility symlink
  ansible.builtin.file:
    src: /usr/bin/podman-compose
    dest: /usr/local/bin/docker-compose
    state: link
    force: true

- name: Create systemd user service drop-in directory for cgroup delegation
  ansible.builtin.file:
    path: /etc/systemd/system/user@.service.d
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Configure cgroup v2 controller delegation for user sessions
  ansible.builtin.template:
    src: delegate.conf.j2
    dest: /etc/systemd/system/user@.service.d/delegate.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd daemon

- name: Create apt's keyring directory
  ansible.builtin.file:
    path: "{{ podman_gvisor_keyring | dirname }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: podman_gvisor_enabled | default(true)

# 0644: apt reads it as _apt, and gpg would have written 0640.
- name: Add the gVisor signing key
  ansible.builtin.get_url:
    url: "{{ podman_gvisor_key_url }}"
    dest: "{{ podman_gvisor_keyring }}"
    owner: root
    group: root
    mode: '0644'
  when: podman_gvisor_enabled | default(true)

- name: Add the gVisor apt repository
  ansible.builtin.apt_repository:
    repo: "{{ podman_gvisor_apt_repo }}"
    filename: gvisor
    state: present
  when: podman_gvisor_enabled | default(true)

- name: Install the gVisor sandbox runtime
  ansible.builtin.apt:
    name: runsc
    state: present
    update_cache: true
  when: podman_gvisor_enabled | default(true)

- name: Deploy gVisor runsc rootless wrapper script
  ansible.builtin.template:
    src: runsc-wrapper.j2
    dest: "{{ podman_gvisor_wrapper }}"
    owner: root
    group: root
    mode: '0755'
  when: podman_gvisor_enabled | default(true)

- name: Create Podman configuration drop-in directory
  ansible.builtin.file:
    path: /etc/containers/containers.conf.d
    state: directory
    mode: '0755'
    owner: root
    group: root
  when: podman_gvisor_enabled | default(true)

- name: Configure gVisor runtime for Podman
  ansible.builtin.template:
    src: gvisor.conf.j2
    dest: /etc/containers/containers.conf.d/gvisor.conf
    owner: root
    group: root
    mode: '0644'
  when: podman_gvisor_enabled | default(true)

- name: Get agent user UID
  ansible.builtin.command:
    cmd: "id -u {{ podman_gvisor_agent_name }}"
  register: podman_gvisor_uid_result
  changed_when: false

- name: Ensure user runtime directory exists
  ansible.builtin.file:
    path: "/run/user/{{ podman_gvisor_uid_result.stdout }}"
    state: directory
    owner: "{{ podman_gvisor_agent_name }}"
    group: "{{ podman_gvisor_agent_name }}"
    mode: '0700'

- name: Enable and start rootless Podman socket for agent user
  ansible.builtin.systemd_service:
    name: podman.socket
    scope: user
    state: started
    enabled: true
  become: true
  become_user: "{{ podman_gvisor_agent_name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_gvisor_uid_result.stdout }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_gvisor_uid_result.stdout }}/bus"
