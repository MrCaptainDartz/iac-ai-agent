---
- name: Update apt cache and upgrade all system packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
    cache_valid_time: 3600

- name: Install essential system tools (Linux - apt)
  ansible.builtin.apt:
    name:
      # Hypervisor integration (Proxmox VE)
      - qemu-guest-agent
      # Editors
      - vim
      - nano
      # Version control
      - git
      - git-lfs
      # Search & Code exploration
      - ripgrep
      - fd-find
      # Network tools
      - curl
      - wget
      - netcat-openbsd
      - dnsutils
      - iputils-ping
      - traceroute
      - tcpdump
      - nmap
      - socat
      # Performance & Hardware/GPU Monitoring
      - btop
      - htop
      - iotop
      - iftop
      - sysstat
      - procps
      - nvtop
      # Debugging tools
      - strace
      - lsof
      # System utilities & Archives
      - tmux
      - tree
      - jq
      - unzip
      - zstd
      - rsync
      - less
      - file
      # Development & Build tools
      - build-essential
      # Security & ACL
      - acl
      - ufw
    state: present
    update_cache: true

- name: Ensure qemu-guest-agent service is started and enabled
  ansible.builtin.systemd_service:
    name: qemu-guest-agent
    state: started
    enabled: true

- name: Install additional custom system packages
  ansible.builtin.apt:
    name: "{{ essential_packages_extra }}"
    state: present
    update_cache: true
  when: essential_packages_extra is defined and (essential_packages_extra | length > 0)
