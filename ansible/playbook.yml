---
- name: Provision and configure AI agent VM environment
  hosts: all
  become: true
  pre_tasks:
    - name: Default the agent account name when the deployment did not set it
      ansible.builtin.set_fact:
        agent_name: "{{ agent_name | default('agent') }}"

    - name: Wait for cloud-init to finish its initial setup
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        state: present
        timeout: 600

    # Checked before the filter is lifted: a run failing here would leave the agent zone open.
    - name: Pre-flight check that the inference gateway has an alias table
      ansible.builtin.assert:
        that:
          - inference_gateway_models is defined
          - inference_gateway_models | length > 0
        fail_msg: "inference_gateway_enabled with no alias table: declare inference_gateway_models, or set the flag to false (README)."
      when: inference_gateway_enabled | default(true)

    - name: Pre-flight check that the egress proxy has an allowlist
      ansible.builtin.assert:
        that:
          - agent_egress_proxy_allowlist is defined
          - agent_egress_proxy_allowlist | length > 0
        fail_msg: "agent_egress_proxy_enabled with no allowlist: declare agent_egress_proxy_allowlist, or set the flag to false (README)."
      when: agent_egress_proxy_enabled | default(false)

    - name: Pre-flight check that the Kubernetes broker has a kubeconfig
      ansible.builtin.assert:
        that:
          - k8s_broker_kubeconfig_src | default('') | length > 0
          - (lookup('ansible.builtin.file', k8s_broker_kubeconfig_src | default(''), errors='ignore') | default('', true)) is search('server:')
        fail_msg: "k8s_broker_enabled, but k8s_broker_kubeconfig_src is missing, unreadable or without a server: line (README)."
      when: k8s_broker_enabled | default(false)

    - name: Check whether the deployment key exists on the control node
      ansible.builtin.stat:
        path: "{{ git_broker_ssh_key_src }}"
      register: git_broker_deployment_key
      delegate_to: localhost
      become: false
      when: git_broker_enabled | default(false)

    - name: Publish a fresh deployment key for the forge, on the run that creates it
      when:
        - git_broker_enabled | default(false)
        - git_broker_ssh_key_src | default('') | length > 0
        - not (git_broker_deployment_key.stat.exists | default(false))
      delegate_to: localhost
      become: false
      block:
        - name: Create the output directory
          ansible.builtin.file:
            path: "{{ git_broker_ssh_key_src | dirname }}"
            state: directory
            mode: '0700'

        - name: Generate the deployment key and its public half
          ansible.builtin.command:
            cmd: >-
              ssh-keygen -q -t ed25519 -N '' -C git-broker
              -f {{ git_broker_ssh_key_src }}
            creates: "{{ git_broker_ssh_key_src }}"

        - name: Give the key to register, and stop before a run that could only fail
          ansible.builtin.debug:
            msg:
              - "Deployment key created: {{ git_broker_ssh_key_src }}"
              - "Its public half, to register, is {{ git_broker_ssh_key_src }}.pub"
              - >-
                Register it as a WRITE deploy key on
                {{ git_broker_repos | default([]) | join(', ') }}, then run the play again.

        - name: End the play here — the forge does not know that key yet
          ansible.builtin.meta: end_play

    - name: Pre-flight check that this VM reaches the forge's SSH
      ansible.builtin.wait_for:
        host: "{{ git_broker_forge_ssh_host }}"
        port: "{{ git_broker_forge_ssh_port }}"
        timeout: 10
        msg: "{{ git_broker_forge_ssh_host }}:{{ git_broker_forge_ssh_port }} unreachable from this VM — it carries the git transport: open it."
      when:
        - git_broker_enabled | default(false)
        - git_broker_forge_ssh_host | default('') | length > 0

    - name: Pre-flight check that this VM reaches the forge's HTTPS
      ansible.builtin.wait_for:
        host: "{{ git_broker_api_upstream | urlsplit('hostname') }}"
        port: "{{ git_broker_api_upstream | urlsplit('port') | default(443, true) }}"
        timeout: 10
        msg: >-
          {{ git_broker_api_upstream }} unreachable from this VM — it carries the API and LFS: open it, and
          give the VM the resolver that knows this name.
      when:
        - git_broker_enabled | default(false)
        - git_broker_api_upstream | default('') | length > 0

    - name: Pre-flight check that the git broker has its credentials
      ansible.builtin.assert:
        that:
          - git_broker_forge_ssh_host | default('') | length > 0
          - git_broker_repos | default([]) | length > 0
          - git_broker_forge_host_key | default('') | length > 0
          - (lookup('ansible.builtin.file', git_broker_ssh_key_src | default(''), errors='ignore') | default('', true) | trim) | length > 0
        fail_msg: "git_broker_enabled, but the forge endpoint, the repositories, the forge host key or the deployment key is missing or unreadable (README)."
      when: git_broker_enabled | default(false)

    - name: Pre-flight check that the git broker's HTTP half is complete
      ansible.builtin.assert:
        that:
          - token_proxy_enabled | default(false)
          - (lookup('ansible.builtin.file', git_broker_token_src | default(''), errors='ignore') | default('', true) | trim) | length > 0
          - >-
            (git_broker_api_ca_src | default('') | length == 0) or ((lookup('ansible.builtin.file',
            git_broker_api_ca_src | default(''), errors='ignore') | default('', true)) | length > 0)
        fail_msg: >-
          git_broker_api_upstream declared, but the HTTP half is incomplete: token_proxy_enabled false, token file
          missing, or the authority unreadable (README) — or drop it for a git-only broker.
      when:
        - git_broker_enabled | default(false)
        - git_broker_api_upstream | default('') | length > 0

    # Provisioning needs the network this filter removes: lifted for the run, re-applied last — a run failing before that leaves the agent zone open.
    - name: Check whether the agent egress filter is currently loaded
      ansible.builtin.command:
        cmd: /usr/sbin/nft list table inet agent_egress
      register: agent_egress_filter
      changed_when: false
      failed_when: false

    - name: Lift the agent egress filter for the duration of the run
      ansible.builtin.command:
        cmd: /usr/sbin/nft destroy table inet agent_egress
      changed_when: true
      when: agent_egress_filter.rc | default(1) == 0

  roles:
    - system_timezone
    - essential_packages
    - developer_config
    - security_hardening
    - agent_user
    - podman_gvisor
    - firewall
    - nvm
    - uv
    - role: ollama
      when: ollama_enabled | default(true)
    # Trust zone first: every component holding a secret runs under it, never under the agent uid.
    - trust_zone
    - inference_gateway
    - agent_egress_proxy
    - k8s_broker
    # The git broker declares what needs a credential; the token proxy serves it on the loopback.
    - git_broker
    - role: token_proxy
      vars:
        token_proxy_injections: "{{ git_broker_injections | default([]) }}"
    # Last: locks the sandbox down and closes the pre_tasks window.
    - agent_egress
  post_tasks:
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    # A VM that does not survive its own reboots can turn this off: the play ends on the running kernel.
    - name: Reboot machine to apply pending kernel updates
      ansible.builtin.reboot:
        msg: "Rebooting machine to apply pending kernel updates"
      when:
        - reboot_required_file.stat.exists
        - system_reboot_on_kernel_update | default(true)

    - name: VM Ready for AI Agent
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is ready!"
          - "Connect to the VM with 'ssh {{ agent_name }}@{{ ansible_host }}'"
          - >-
            {{ 'Ollama is installed and ready. You can initialize your AI agent.'
               if (ollama_enabled | default(true))
               else 'Ollama installation was skipped. Your VM environment is ready for your AI agent.' }}
