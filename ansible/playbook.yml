---
- name: Provision and configure AI agent VM environment
  hosts: all
  become: true
  pre_tasks:
    - name: Wait for cloud-init to finish its initial setup
      ansible.builtin.wait_for:
        path: /var/lib/cloud/instance/boot-finished
        state: present
        timeout: 600

    # Checked before the filter is lifted: a run failing here would leave the agent zone open.
    - name: Pre-flight check that the inference gateway has an alias table
      ansible.builtin.assert:
        that:
          - inference_gateway_models is defined
          - inference_gateway_models | length > 0
        fail_msg: >-
          inference_gateway_models is empty. Declare the alias table (or set
          inference_gateway_enabled: false) before running the play.
      when: inference_gateway_enabled | default(true)

    - name: Pre-flight check that the egress proxy has an allowlist
      ansible.builtin.assert:
        that:
          - agent_egress_proxy_allowlist is defined
          - agent_egress_proxy_allowlist | length > 0
        fail_msg: >-
          agent_egress_proxy_enabled is true but agent_egress_proxy_allowlist is empty. Declare
          the destinations (or set agent_egress_proxy_enabled: false) before running the play.
      when: agent_egress_proxy_enabled | default(false)

    - name: Pre-flight check that the Kubernetes broker has a kubeconfig
      ansible.builtin.assert:
        that:
          - k8s_broker_kubeconfig_src | default('') | length > 0
          - >-
            (lookup('ansible.builtin.file', k8s_broker_kubeconfig_src | default(''), errors='ignore')
             | default('', true)) is search('server:')
        fail_msg: >-
          k8s_broker_enabled is true but k8s_broker_kubeconfig_src is empty, unreadable, or does
          not hold a kubeconfig. Generate the ServiceAccount's kubeconfig (README) before the play.
      when: k8s_broker_enabled | default(false)

    # Provisioning installs tooling as the harness user (nvm, npm) and needs the network this
    # filter removes: lifted for the run, re-applied last. A run failing before that leaves it open.
    - name: Check whether the agent egress filter is currently loaded
      ansible.builtin.command:
        cmd: /usr/sbin/nft list table inet agent_egress
      register: agent_egress_filter
      changed_when: false
      failed_when: false

    - name: Lift the agent egress filter for the duration of the run
      ansible.builtin.command:
        cmd: /usr/sbin/nft destroy table inet agent_egress
      changed_when: true
      when: agent_egress_filter.rc | default(1) == 0

  roles:
    - system_timezone
    - essential_packages
    - developer_config
    - security_hardening
    - harness_user
    - podman_gvisor
    - firewall
    - nvm
    - uv
    - role: ollama
      when: ollama_enabled | default(true)
    # Trust zone first: every component holding a secret runs under it, never under the harness uid.
    - trust_zone
    - inference_gateway
    - agent_egress_proxy
    - k8s_broker
    # Last: locks the sandbox down and closes the pre_tasks window.
    - agent_egress
  post_tasks:
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Reboot machine to apply pending kernel updates
      ansible.builtin.reboot:
        msg: "Rebooting machine to apply pending kernel updates"
      when: reboot_required_file.stat.exists

    - name: VM Ready for AI Agent
      ansible.builtin.debug:
        msg:
          - "{{ inventory_hostname }} is ready!"
          - "Connect to the VM with 'ssh {{ harness_name | default('hermes') }}@{{ ansible_host }}'"
          - >-
            {{ 'Ollama is installed and ready. You can initialize your AI agent.'
               if (ollama_enabled | default(true))
               else 'Ollama installation was skipped. Your VM environment is ready for your AI agent.' }}
